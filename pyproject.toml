[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacs-improvement"
version = "0.1.0"
description = "Reproduction and improvement of Task-Aligned Context Selection"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

